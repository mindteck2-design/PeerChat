name: Build PeerChat Installers (Windows & Linux)

on:
  push:
    branches: [ "main", "v*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "v*" ]
  workflow_dispatch:

jobs:
  build-linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: app
        run: npm test

      - name: Run backend unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      # ── Standard Edition (No Games) ──
      - name: Build Standard Linux .deb bundle (No Games)
        working-directory: app
        run: npm run tauri:build -- --bundles deb

      - name: Prepare Standard Linux package
        run: |
          mkdir -p artifacts/standard
          cp app/src-tauri/target/release/bundle/deb/*.deb artifacts/standard/
          for f in artifacts/standard/*.deb; do
            mv "$f" "${f%.deb}-standard.deb"
          done

      - name: Upload Standard Linux .deb package
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-linux-deb-standard
          path: artifacts/standard/*.deb
          if-no-files-found: error

      # ── Intranet Edition (With Games) ──
      - name: Build Intranet Linux .deb bundle (With Games)
        working-directory: app
        env:
          VITE_ENABLE_GAMES: "true"
        run: |
          touch src-tauri/src/main.rs
          npm run tauri:build -- --bundles deb

      - name: Prepare Intranet Linux package
        run: |
          mkdir -p artifacts/intranet
          cp app/src-tauri/target/release/bundle/deb/*.deb artifacts/intranet/
          for f in artifacts/intranet/*.deb; do
            mv "$f" "${f%.deb}-intranet.deb"
          done

      - name: Upload Intranet Linux .deb package
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-linux-deb-intranet
          path: artifacts/intranet/*.deb
          if-no-files-found: error

  build-windows-nsis:
    name: Windows (NSIS .exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: app
        run: npm test

      - name: Run backend unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      # ── Standard Edition (No Games) ──
      - name: Build Standard Windows NSIS installer (No Games)
        working-directory: app
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare Standard Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/standard
          Get-ChildItem -Path app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $newName = $_.BaseName + "-standard" + $_.Extension
            Copy-Item $_.FullName -Destination "artifacts/standard/$newName"
          }

      - name: Upload Standard Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-windows-installer-standard
          path: artifacts/standard/*.exe
          if-no-files-found: error

      # ── Intranet Edition (With Games) ──
      - name: Build Intranet Windows NSIS installer (With Games)
        working-directory: app
        env:
          VITE_ENABLE_GAMES: "true"
        run: |
          (Get-Item src-tauri/src/main.rs).LastWriteTime = Get-Date
          npm run tauri:build -- --bundles nsis

      - name: Prepare Intranet Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/intranet
          Get-ChildItem -Path app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $newName = $_.BaseName + "-intranet" + $_.Extension
            Copy-Item $_.FullName -Destination "artifacts/intranet/$newName"
          }

      - name: Upload Intranet Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-windows-installer-intranet
          path: artifacts/intranet/*.exe
          if-no-files-found: error
