name: Build PeerChat Installers (Windows & Linux)

on:
  push:
    branches: [ "main", "v*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "v*" ]
  workflow_dispatch:

jobs:
  build-linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: app
        run: npm test

      - name: Run backend unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Build Tauri .deb bundle
        working-directory: app
        run: npm run tauri:build -- --bundles deb

      - name: Upload Linux .deb package
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-linux-deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows-nsis:
    name: Windows (NSIS .exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: app
        run: npm test

      - name: Run backend unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Build Tauri NSIS installer
        working-directory: app
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
